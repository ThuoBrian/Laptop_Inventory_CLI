{% set status_filter = status_filter | default('') %}
{% set current_page = current_page | default(1) %}
<h2>Assign Laptop</h2>
<form hx-post="/ui/laptops/{{ laptop_id }}/assign?page={{ current_page }}{% if status_filter %}&status={{ status_filter }}{% endif %}"
      hx-target="#assign-modal-container"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) document.getElementById('assign-modal').close()">
    <div class="form-group">
        <label for="user_id">Assign to</label>
        <select name="user_id" id="user_id" required>
            {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }} ({{ user.department }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('assign-modal').close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Assign</button>
    </div>
</form>
