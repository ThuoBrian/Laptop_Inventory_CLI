{% extends "base.html" %}
{% block title %}Laptops{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Laptops</h1>
    <button class="btn btn-primary"
            hx-get="/ui/laptops/new-form"
            hx-target="#laptop-form-container"
            hx-swap="innerHTML"
            hx-on::after-swap="document.getElementById('laptop-form-modal').showModal()">+ New Laptop</button>
</div>

<div id="laptop-table"
     hx-get="/ui/laptops"
     hx-trigger="load"
     hx-swap="innerHTML">
    <p>Loading...</p>
</div>

<dialog id="laptop-form-modal">
    <div id="laptop-form-container"></div>
</dialog>

<dialog id="assign-modal">
    <div id="assign-modal-container"></div>
</dialog>
{% endblock %}
