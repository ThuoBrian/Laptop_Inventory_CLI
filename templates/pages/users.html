{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Users</h1>
    <button class="btn btn-primary"
            hx-get="/ui/users/new-form"
            hx-target="#user-form-container"
            hx-swap="innerHTML"
            hx-on::after-swap="document.getElementById('user-form-modal').showModal()">+ New User</button>
</div>

<div id="user-table"
     hx-get="/ui/users"
     hx-trigger="load"
     hx-swap="innerHTML">
    <p>Loading...</p>
</div>

<dialog id="user-form-modal">
    <div id="user-form-container"></div>
</dialog>
{% endblock %}
